# ── Application ──────────────────────────────────────────────────────────────
spring:
  application:
    name: cura

  # ── Database ──────────────────────────────────────────────────────────────
  datasource:
    url:          ${DB_URL:jdbc:postgresql://localhost:5432/cura}
    username:     ${DB_USERNAME:cura}
    password:     ${DB_PASSWORD:ayush}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle:      2
      connection-timeout: 30000

  # ── JPA / Hibernate ───────────────────────────────────────────────────────
  jpa:
    hibernate:
      # 'validate' — Hibernate checks entity mappings match DB tables but never alters schema.
      # Flyway owns schema creation. This value must NEVER be 'create', 'create-drop', or 'update'
      # in any non-local environment.
      ddl-auto: validate
    show-sql: false          # set to true temporarily when debugging SQL queries
    open-in-view: false      # disable OSIV — keeps transactions inside service layer
    properties:
      hibernate:
        dialect:    org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── Flyway (schema migrations) ────────────────────────────────────────────
  flyway:
    enabled:   true
    locations: classpath:db/migration
    baseline-on-migrate: false   # set to true only for pre-existing databases

  # ── File uploads ──────────────────────────────────────────────────────────
  servlet:
    multipart:
      enabled:        true
      max-file-size:  20MB
      max-request-size: 25MB

# ── Server ───────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  error:
    # Never expose stack traces or internal messages in HTTP error responses
    include-message:    never
    include-stacktrace: never
    include-exception:  false

# ── Actuator ─────────────────────────────────────────────────────────────────
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      show-details: never    # never expose DB connection details publicly
  info:
    env:
      enabled: true

# ── Application info (shown at /actuator/info) ───────────────────────────────
info:
  app:
    name:        CURA
    description: Telehealth, EMR, and Emergency Platform
    version:     "@project.version@"

# ── OpenAPI / Swagger ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path:               /swagger-ui.html
    operations-sorter:  alpha
    tags-sorter:        alpha
    display-request-duration: true

# ── CURA application properties ──────────────────────────────────────────────
cura:
  version: "0.1.0"

  cors:
    allowed-origins:
      - ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  file-storage:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}

  ai:
    provider: ${AI_PROVIDER:mock}          # 'gemini' | 'mock'
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model:   ${GEMINI_MODEL:gemini-1.5-flash}

  notification:
    provider: ${NOTIFICATION_PROVIDER:mock}  # 'email' | 'mock'

  jwt:
    # Placeholders — actual values must be set via env vars in all environments
    secret:              ${JWT_SECRET:}       # Set in M2 — min 32 chars, random
    access-token-expiry: ${JWT_ACCESS_EXPIRY_MS:900000}    # 15 minutes
    refresh-token-expiry: ${JWT_REFRESH_EXPIRY_DAYS:7}     # 7 days

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    root:          WARN
    com.cura:      INFO
    org.hibernate.SQL: WARN   # set to DEBUG to see SQL — never in production
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
