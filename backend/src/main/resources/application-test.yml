# Test profile — overrides application.yml for unit and integration tests
spring:
  datasource:
    # H2 in-memory DB for fast unit tests that don't need PostGIS
    # Integration tests with PostGIS use @Testcontainers instead
    url:      jdbc:h2:mem:cura_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop   # H2 only — Flyway is disabled in test profile
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  flyway:
    enabled: false   # Disabled for unit/MockMvc tests — re-enable for Testcontainers tests

cura:
  ai:
    provider: mock

  notification:
    provider: mock

  cors:
    allowed-origins:
      - http://localhost:5173

  jwt:
    secret: test-secret-key-must-be-at-least-32-characters-long-for-hmac
    access-token-expiry: 900000
    refresh-token-expiry: 7
